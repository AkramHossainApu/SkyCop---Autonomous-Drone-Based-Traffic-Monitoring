plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.skycop'
version = '1.0.0'

android {
  namespace "com.skycop.sim"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // The live camera's frames come from react-native-webrtc's tracks (see LiveFeed.kt).
  implementation project(':react-native-webrtc')
  implementation 'com.facebook.react:react-android'
}

android {
  // The Dhaka maps built by maps/build_maps.py.
  sourceSets {
    main.assets.srcDirs += '../assets'
  }
}
